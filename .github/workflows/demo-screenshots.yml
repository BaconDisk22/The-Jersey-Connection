name: Jersey Demo Screenshots
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshot-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture demo screenshots
        run: node scripts/capture-demo.cjs
      - name: Open screenshot pull request
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_PATHS: |
            screenshots/jersey-demo-desktop.png
            screenshots/jersey-demo-mobile.png
          CHECK_WORKFLOWS: |
            pr-checks.yml
        run: bash .github/scripts/open-screenshot-pr.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: jersey-demo-screenshots
          path: screenshots/*.png
          if-no-files-found: error
