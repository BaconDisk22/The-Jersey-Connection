name: Jersey PR Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jersey-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate desktop JavaScript and package
        run: |
          node --check macos/main.js
          node -e "const p=require('./macos/package.json'); if(!p.scripts?.dist || !p.build?.mac)process.exit(1)"
      - name: Validate GitHub workflows
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import glob,yaml
          for path in glob.glob('.github/workflows/*.yml'):
              with open(path,encoding='utf-8') as f: yaml.safe_load(f)
              print('Valid YAML:',path)
          PY
  intel-package:
    name: intel-package
    if: github.event_name == 'pull_request'
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: macos
        run: npm install --no-audit --no-fund
      - name: Package unsigned Intel app
        working-directory: macos
        run: npm run dist
      - name: Assert installer artifacts exist
        run: |
          ls macos/dist/*.dmg
          ls macos/dist/*.zip
