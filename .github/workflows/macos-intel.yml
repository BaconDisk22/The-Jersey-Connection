name: Build The Jersey Connection Intel Mac
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: macos
        run: npm install --no-audit --no-fund
      - name: Package Intel DMG and ZIP
        working-directory: macos
        run: npm run dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-Jersey-Connection-Intel
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" macos/dist/*.dmg macos/dist/*.zip --title "The Jersey Connection ${GITHUB_REF_NAME}" --notes "Unsigned Intel macOS preview build. Connects to the existing online MeshMap service." --prerelease
