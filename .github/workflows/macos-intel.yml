name: Build The Jersey Connection Intel Mac
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: jersey-mac-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate desktop sources
        run: |
          node --check macos/main.js
          node --check macos/local-server.js
          node -e "const p=require('./macos/package.json'); if(!p.scripts?.dist || !p.build?.mac)process.exit(1)"
      - name: Install dependencies
        working-directory: macos
        run: npm install --no-audit --no-fund
      - name: Package Intel DMG and ZIP
        working-directory: macos
        run: npm run dist
      - name: Verify both installers exist and are nonempty
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(macos/dist/*.dmg)
          zips=(macos/dist/*.zip)
          (( ${#dmgs[@]} > 0 && ${#zips[@]} > 0 ))
          for file in "${dmgs[@]}" "${zips[@]}"; do test -s "$file"; done
      - name: Generate SHA256 checksums
        run: |
          cd macos/dist
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-Jersey-Connection-Intel
          if-no-files-found: error
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
            macos/dist/SHA256SUMS.txt
      - name: Publish successful build to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            release_tag="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            echo "Not publishing from untrusted ref: ${GITHUB_REF}"
            exit 0
          fi
          files=(macos/dist/*.dmg macos/dist/*.zip macos/dist/SHA256SUMS.txt)
          notes="Unsigned Intel macOS preview. Not notarized; verify checksums before installing. Default map uses the upstream hosted MeshMap service. Local server is for development only."
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading verified assets."
            gh release upload "$release_tag" "${files[@]}" --clobber
          else
            gh release create "$release_tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "The Jersey Connection $release_tag" \
              --notes "$notes" \
              --prerelease
          fi
